# Profile for the ts-mini fixture target. Its throwaway GitHub mirror is created by the
# operator (fixtures/targets/README.md); private targets keep their profiles in the private store.
schema_version: 1
target: {repo: caglarsubas/factory-fixture-ts-mini, default_branch: main, visibility: private}
factory_release: v0.1.0
commands:
  setup: pnpm install --frozen-lockfile
  typecheck: pnpm exec tsc --noEmit
  lint: pnpm exec tsc --noEmit -p tsconfig.lint.json
  test: node --test
gates: {adapters: [typescript], sast_rules: [default, sink_added]}
protected_paths:
  - {glob: "src/auth/**", minimum_risk: R3, note: session signing}
restricted: []
invariants:
  - {id: INV-1, text: "listOrders returns orders oldest first", check: "node --test test/orders.test.ts"}
egress_class: anthropic_only
budgets: {monthly_usd: 25}
spec_dir: docs/specs
retention_days: {bundles: 30, transcripts: 30, otel: 30}
