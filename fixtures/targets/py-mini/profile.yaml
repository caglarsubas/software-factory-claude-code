# Profile for the py-mini fixture target. Its throwaway GitHub mirror is created by the
# operator (fixtures/targets/README.md); private targets keep their profiles in the private store.
schema_version: 1
target: {repo: caglarsubas/factory-fixture-py-mini, default_branch: main, visibility: private}
factory_release: v0.1.0
commands:
  setup: uv sync --frozen
  typecheck: uv run --frozen mypy
  lint: uv run --frozen ruff check
  test: uv run --frozen pytest -q
gates: {adapters: [python], sast_rules: [default, sink_added]}
protected_paths:
  - {glob: "src/inventory/auth/**", minimum_risk: R3, note: token signing}
restricted: []
invariants:
  - {id: INV-1, text: "Stock never accepts a negative addition", check: "uv run --frozen pytest -q tests/test_stock.py"}
egress_class: anthropic_only
budgets: {monthly_usd: 25}
spec_dir: docs/specs
retention_days: {bundles: 30, transcripts: 30, otel: 30}
