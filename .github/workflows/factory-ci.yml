name: factory-ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its base: check-evals compares a pull request against HEAD^1.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:md
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:docs
      - run: pnpm check:evals
      - run: pnpm check:release
      - name: A change never edits an agent together with the evals that judge it
        if: github.event_name == 'pull_request'
        run: node scripts/check-evals.ts --base HEAD^1
      # The version matches config/factory.yaml's claude_code.version (checked by the conformance test).
      - name: Validate plugin and marketplace
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.286 plugin validate plugin --strict
          npx --yes @anthropic-ai/claude-code@2.1.286 plugin validate . --strict

  # The gate runner (P0-06): check every pinned download's signature or provenance, build the
  # image, then run the rule tests and the seeded-defect suite through real containers.
  gates:
    name: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - name: Verify pinned tool signatures and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node gates/src/verify-tools.ts
      - name: Build the gate image
        run: node gates/src/cli.ts image
      - name: Rule tests and seeded-defect suite
        run: pnpm test:gates

  # The runner (P2-01): build the runner image and run its conformance suite, the pinned CLI in
  # the image against a stub model, on both architectures operators run (Apple silicon is arm64).
  runner:
    name: runner (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: User namespaces for the Bash sandbox inside the runner
        # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs; the runner
        # container runs with AppArmor unconfined on such hosts (controller/src/runner/container.ts).
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Runner conformance suite
        run: pnpm test:runner

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: zizmor
        run: uvx zizmor@1.30.1 --offline --min-severity low .github/workflows

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown

  # The single required status check: green only when every job above succeeded.
  ci:
    name: ci
    if: always()
    needs: [check, gates, runner, workflow-lint, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
