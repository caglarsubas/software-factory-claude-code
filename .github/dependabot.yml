version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: ["/", "/controller", "/gates"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint 8.x supports TypeScript < 6.1 (typescript-eslint#10940 tracks 7.x).
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Node types track the runtime's major version (.node-version).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The SDK matches the Claude Code pin in config/factory.yaml; the operator moves both together.
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
    groups:
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
  # The gate and runner images' base images (pinned by digest), bumped together in one PR: the
  # runner runs a target's commands with the gates' toolchain, and runner.test.ts keeps the pins
  # equal. Tool downloads are pinned in the same Dockerfiles by SHA-256 and verified in CI; bump
  # those by hand with gates/src/verify-tools.ts.
  - package-ecosystem: docker
    directories:
      - /gates/image
      - /runner
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # The image runs Node 24 LTS, like the factory (.node-version).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
